version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tdc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tdc_db}
      POSTGRES_USER: ${POSTGRES_USER:-tdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tdc_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tdc_user} -d ${POSTGRES_DB:-tdc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tdc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tdc_backend
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-tdc-super-secret-key-tecox-2026-prod}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-tdc_db}
      POSTGRES_USER: ${POSTGRES_USER:-tdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tdc_password_2026}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tdc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tdc_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    networks:
      - tdc_network

  nginx:
    image: nginx:alpine
    container_name: tdc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/app/staticfiles:ro
      - backend_media:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - tdc_network

volumes:
  postgres_data:
  backend_media:
  backend_static:

networks:
  tdc_network:
    driver: bridge
